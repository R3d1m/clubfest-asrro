services:
  # Backend Web Service (Express + Socket.IO)
  - type: web
    name: clubfest-asrro-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0

  # Frontend Static Site (Vite + React)
  - type: web
    name: clubfest-asrro-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://clubfest-asrro.onrender.com
